# ===================================================================
# KINO-MODUS: SYNKRONISERING (FORBEDRET)
# ===================================================================
- id: 'kino_synk_alle_pa_v2'
  alias: "Kino: En på = alle på v2"
  description: "Slår på alle kino-enheter med riktig volum når én slås på."
  trigger:
    - platform: state
      entity_id:
        - media_player.shield_2
        - media_player.samsung_qn85ba_85_qe85qn85batxxc
        - media_player.rx_v685_3c03b4
      from: 'off'
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.kino_synkronisering
      state: 'on'
    - condition: template
      value_template: >
        {{ ['off', 'unavailable', 'unknown'] | intersect([
          states('media_player.shield_2'),
          states('media_player.samsung_qn85ba_85_qe85qn85batxxc'),
          states('media_player.rx_v685_3c03b4')
        ]) | length > 0 }}
  action:
    - service: system_log.write
      data:
        message: "Kino synk: {{ trigger.to_state.attributes.friendly_name }} slo på systemet"
        level: info
    - service: media_player.turn_on
      target:
        entity_id:
          - media_player.shield_2
          - media_player.samsung_qn85ba_85_qe85qn85batxxc
          - media_player.rx_v685_3c03b4
    # Økt timeout til 45 sekunder for sikkerhet
    - wait_template: >
        {{ states('media_player.rx_v685_3c03b4') not in ['off', 'unavailable', 'unknown'] }}
      timeout:
        seconds: 45
      continue_on_timeout: true
    - delay:
        seconds: 5
    - if:
        - condition: template
          value_template: >
            {{ states('media_player.rx_v685_3c03b4') not in ['off', 'unavailable', 'unknown'] }}
      then:
        - service: media_player.volume_set
          target:
            entity_id: media_player.rx_v685_3c03b4
          data:
            volume_level: "{{ states('input_number.kino_standard_volum') | float }}"
        - service: system_log.write
          data:
            message: "Kino synk: Volum satt til {{ (states('input_number.kino_standard_volum') | float * 100) | int }}%"
            level: info
      else:
        - service: system_log.write
          data:
            message: "Kino synk: ADVARSEL - Receiver ikke klar etter 45 sek, hopper over volum"
            level: warning
  mode: single

- id: 'kino_synk_alle_av_v2'
  alias: "Kino: En av = alle av v2"
  description: "Slår av alle kino-enheter når én slås av."
  trigger:
    - platform: state
      entity_id:
        - media_player.shield_2
        - media_player.samsung_qn85ba_85_qe85qn85batxxc
        - media_player.rx_v685_3c03b4
      to: 'off'
      for:
        seconds: 2
  condition:
    - condition: state
      entity_id: input_boolean.kino_synkronisering
      state: 'on'
    - condition: template
      value_template: >
        {{ ['on', 'playing', 'paused', 'idle'] | intersect([
          states('media_player.shield_2'),
          states('media_player.samsung_qn85ba_85_qe85qn85batxxc'),
          states('media_player.rx_v685_3c03b4')
        ]) | length > 0 }}
  action:
    - service: system_log.write
      data:
        message: "Kino synk: {{ trigger.to_state.attributes.friendly_name }} slo av systemet"
        level: info
    - service: media_player.turn_off
      target:
        entity_id:
          - media_player.shield_2
          - media_player.samsung_qn85ba_85_qe85qn85batxxc
          - media_player.rx_v685_3c03b4
    - service: system_log.write
      data:
        message: "Kino synk: Alle enheter slått av"
        level: info
  mode: single


# ===================================================================
# VARMEPUMPE DATAROM: DYNAMISK FAN SPEED (FORBEDRET)
# ===================================================================
- id: 'varmepumpe_datarom_dynamisk_fan_speed_v2'
  alias: "Varmepumpe Datarom - Dynamisk fan speed v2"
  description: "Justerer viftehastighet basert på temperaturavvik med hysterese."
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/2"
    - platform: state
      entity_id: climate.vp_datarom
      attribute: current_temperature
    - platform: state
      entity_id: climate.vp_datarom
      attribute: temperature

  condition:
    - condition: state
      entity_id: climate.vp_datarom
      state: 'cool'
    - condition: state
      entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
      state: 'off'
    - condition: template
      value_template: "{{ states('climate.vp_datarom') not in ['unavailable', 'unknown'] }}"

  action:
    - variables:
        strong_on: "{{ states('input_number.vp_datarom_strong_terskel_paa') | float(3.0) }}"
        strong_off: "{{ states('input_number.vp_datarom_strong_terskel_av') | float(2.5) }}"
        current_temp: "{{ state_attr('climate.vp_datarom', 'current_temperature') | float(0) }}"
        target_temp:  "{{ state_attr('climate.vp_datarom', 'temperature') | float(0) }}"
        temp_diff:    "{{ current_temp - target_temp }}"
        current_fan:  "{{ state_attr('climate.vp_datarom', 'fan_mode') | default('auto') }}"

    - choose:
        # Slå PÅ strong når avviket er større enn terskel
        - conditions:
            - "{{ temp_diff > strong_on }}"
            - "{{ current_fan != 'strong' }}"
          sequence:
            - service: climate.set_fan_mode
              target:
                entity_id: climate.vp_datarom
              data:
                fan_mode: 'strong'
            - service: system_log.write
              data:
                message: "VP Datarom: Fan satt til STRONG (avvik: {{ temp_diff | round(1) }}°C)"
                level: info

        # Slå AV strong (tilbake til auto)
        - conditions:
            - "{{ temp_diff <= strong_off }}"
            - "{{ current_fan != 'auto' }}"
          sequence:
            - service: climate.set_fan_mode
              target:
                entity_id: climate.vp_datarom
              data:
                fan_mode: 'auto'
            - service: system_log.write
              data:
                message: "VP Datarom: Fan satt til AUTO (avvik: {{ temp_diff | round(1) }}°C)"
                level: info


# ===================================================================
# VARMEPUMPE DATAROM: TØRKESYKLUS (FORBEDRET)
# ===================================================================
- id: 'varmepumpe_datarom_daglig_torkesyklus_v2'
  alias: "Varmepumpe Datarom - Daglig tørkesyklus v2"
  description: "Kjører tørkesyklus hver natt, lagrer og gjenoppretter modus."
  mode: single
  trigger:
    - platform: time
      at: "03:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
      state: 'off'
    - condition: template
      value_template: "{{ states('climate.vp_datarom') not in ['unavailable', 'unknown', 'off'] }}"
  action:
    # Lagre nåværende modus
    - variables:
        previous_mode: "{{ states('climate.vp_datarom') }}"

    - service: system_log.write
      data:
        message: "VP Datarom: Starter tørkesyklus (tidligere modus: {{ previous_mode }})"
        level: info

    # Bytt til fan only for tørking
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.vp_datarom
      data:
        hvac_mode: 'fan_only'

    # Vent 1 time
    - delay: "01:00:00"

    # Gjenopprett tidligere modus (hvis den var cool/heat)
    - if:
        - condition: template
          value_template: "{{ previous_mode in ['cool', 'heat', 'heat_cool'] }}"
      then:
        - service: climate.set_hvac_mode
          target:
            entity_id: climate.vp_datarom
          data:
            hvac_mode: "{{ previous_mode }}"
        - service: system_log.write
          data:
            message: "VP Datarom: Tørkesyklus fullført, gjenopprettet modus {{ previous_mode }}"
            level: info
      else:
        # Hvis den var i annen modus, sett tilbake til cool som standard
        - service: climate.set_hvac_mode
          target:
            entity_id: climate.vp_datarom
          data:
            hvac_mode: 'cool'
        - service: system_log.write
          data:
            message: "VP Datarom: Tørkesyklus fullført, satt til cool (tidligere: {{ previous_mode }})"
            level: info


# ===================================================================
# LYS GANG: SMART JUSTERING (FORBEDRET)
# ===================================================================
- id: gang_lys_smart_justering_v2
  alias: "Gang lys - Smart justering v2"
  description: "Justerer lys basert på tid - maks lysstyrke dag, rødt natt."
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/15"
    - platform: state
      entity_id: light.lys_gang
      from: "off"
      to: "on"
  condition:
    - condition: state
      entity_id: light.lys_gang
      state: "on"
    - condition: template
      value_template: "{{ states('light.lys_gang') not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        current_hour: "{{ now().hour }}"
        current_minute: "{{ now().minute }}"
        is_weekday: "{{ now().weekday() < 5 }}"
        is_night: >
          {% if current_hour >= 22 %}
            true
          {% elif current_hour < 6 %}
            true
          {% elif current_hour == 6 and is_weekday and current_minute < 30 %}
            true
          {% elif current_hour == 6 and not is_weekday %}
            true
          {% else %}
            false
          {% endif %}
        dag_brightness: "{{ states('input_number.gang_lys_dag_brightness') | int(254) }}"
        natt_brightness: "{{ states('input_number.gang_lys_natt_brightness') | int(8) }}"

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_night }}"
          sequence:
            # Nattemodus - rød, lav lysstyrke
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: "{{ natt_brightness }}"
                rgb_color: [255, 0, 0]
                transition: 5
            - service: system_log.write
              data:
                message: "Gang lys: Nattemodus aktivert (brightness {{ natt_brightness }})"
                level: debug

      default:
        # Dagmodus - varmhvit, maks lysstyrke
        - service: light.turn_on
          target:
            entity_id: light.lys_gang
          data:
            brightness: "{{ dag_brightness }}"
            color_temp_kelvin: 2702
            transition: 5
        - service: system_log.write
          data:
            message: "Gang lys: Dagmodus aktivert (brightness {{ dag_brightness }})"
            level: debug

- id: gang_lys_nattemodus_overgang_v2
  alias: "Gang lys - Nattemodus overgang v2"
  description: "Bytter mellom dag/natt-modus på riktig tid."
  mode: single
  trigger:
    - platform: time
      at: "22:00:00"
      id: "start_night"
    - platform: time
      at: "06:30:00"
      id: "end_night_weekday"
    - platform: time
      at: "07:00:00"
      id: "end_night_weekend"
  condition:
    - condition: state
      entity_id: light.lys_gang
      state: "on"
    - condition: template
      value_template: "{{ states('light.lys_gang') not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        is_weekday: "{{ now().weekday() < 5 }}"
        dag_brightness: "{{ states('input_number.gang_lys_dag_brightness') | int(254) }}"
        natt_brightness: "{{ states('input_number.gang_lys_natt_brightness') | int(8) }}"

    - choose:
        - conditions:
            - condition: trigger
              id: "start_night"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: "{{ natt_brightness }}"
                rgb_color: [255, 0, 0]
                transition: 10
            - service: system_log.write
              data:
                message: "Gang lys: Byttet til nattemodus"
                level: info

        - conditions:
            - condition: trigger
              id: "end_night_weekday"
            - condition: template
              value_template: "{{ is_weekday }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: "{{ dag_brightness }}"
                color_temp_kelvin: 2702
                transition: 10
            - service: system_log.write
              data:
                message: "Gang lys: Byttet til dagmodus (hverdag)"
                level: info

        - conditions:
            - condition: trigger
              id: "end_night_weekend"
            - condition: template
              value_template: "{{ not is_weekday }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: "{{ dag_brightness }}"
                color_temp_kelvin: 2702
                transition: 10
            - service: system_log.write
              data:
                message: "Gang lys: Byttet til dagmodus (helg)"
                level: info
