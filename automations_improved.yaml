              data:
                value: "{{ timestamp }}"
            - service: system_log.write
              data:
                message: "Ny peak #1: {{ new_peak }} kWh ({{ timestamp }})"
                level: info
        - conditions:
            - "{{ new_peak > peak2 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_3_verdi
              data:
                value: "{{ peak2 }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_3_tidspunkt
              data:
                value: "{{ states('input_text.peak_2_tidspunkt') }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_2_verdi
              data:
                value: "{{ new_peak }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_2_tidspunkt
              data:
                value: "{{ timestamp }}"
            - service: system_log.write
              data:
                message: "Ny peak #2: {{ new_peak }} kWh ({{ timestamp }})"
                level: info
        - conditions:
            - "{{ new_peak > peak3 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_3_verdi
              data:
                value: "{{ new_peak }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_3_tidspunkt
              data:
                value: "{{ timestamp }}"
            - service: system_log.write
              data:
                message: "Ny peak #3: {{ new_peak }} kWh ({{ timestamp }})"
                level: info

- id: effektledd_nullstill_topper_maanedsskifte_v2
