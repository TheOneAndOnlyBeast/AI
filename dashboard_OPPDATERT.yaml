title: Smart Kapasitetsledd
views:
  - title: Hjem
    path: home
    icon: mdi:home-lightning-bolt
    theme: ''
    badges: []
    cards:
      - type: markdown
        content: >
          ## ⚡ Strøm & Kapasitet


          <div style="text-align: center; margin: 10px 0; padding: 10px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          border-radius: 12px; color: white; font-size: 15px; font-weight:
          500;">
            {% set anbefaling = states('sensor.kapasitetsledd_kutt_anbefaling') %}
            {% if anbefaling == 'KUTT NÅ!' %}
              🚨 KUTT NÅ! - Laster kuttes
            {% elif anbefaling == 'VARSLING' %}
              ⚠️ VARSLING - Nærmer seg grense
            {% else %}
              ✅ TRYGT - Innenfor grense
            {% endif %}
          </div>
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.kapasitetsledd_aktuelt
            name: Kapasitetsledd
            unit: kW
            min: 0
            max: 10
            needle: true
            severity:
              green: 0
              yellow: 4.5
              red: 5
            segments:
              - from: 0
                color: '#4CAF50'
              - from: 4.5
                color: '#FF9800'
              - from: 5
                color: '#F44336'
          - type: gauge
            entity: sensor.prognose_for_innevaerende_time
            name: Prognose
            unit: kWh
            min: 0
            max: 10
            needle: true
            severity:
              green: 0
              yellow: 4
              red: 5
            segments:
              - from: 0
                color: '#4CAF50'
              - from: 4
                color: '#FF9800'
              - from: 5
                color: '#F44336'
      - type: entities
        title: Kapasitetsledd (Glitre Nett 2025)
        show_header_toggle: false
        entities:
          - entity: sensor.kapasitetsledd_aktuelt
            name: Nå
            icon: mdi:transmission-tower
          - entity: sensor.kapasitetsledd_trinn
            name: Trinn
            icon: mdi:stairs
          - entity: sensor.kapasitetsledd_kostnad
            name: Kostnad
            icon: mdi:currency-usd
          - type: divider
          - entity: sensor.kapasitetsledd_margin_til_trinn
            name: Margin til neste trinn
            icon: mdi:speedometer
          - entity: sensor.dagens_maks_hittil
            name: Dagens maks (hittil)
            icon: mdi:chart-box
          - type: divider
          - entity: input_number.kapasitetsledd_maal
            name: Mål
            icon: mdi:target
          - entity: sensor.kapasitetsledd_trygg_grense
            name: Trygg grense
            icon: mdi:shield-check
          - entity: sensor.kapasitetsledd_hvis_prognose
            name: Hvis prognose
            icon: mdi:crystal-ball
          - entity: sensor.kapasitetsledd_kutt_anbefaling
            name: Anbefaling
            icon: mdi:alert-decagram
      - type: markdown
        content: >
          <div style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2
          100%); padding: 20px; border-radius: 16px; margin: 8px 0;">
            <h3 style="margin: 0 0 10px 0; text-align: center; color: #1a1a1a;">🏆 Topp-3 DAGER (2025-modell)</h3>
            <div style="text-align: center; font-size: 12px; color: #666; margin-bottom: 15px;">Høyeste timeforbruk per dag fra 3 distinkte dager</div>

            <table style="width: 100%; border-collapse: separate; border-spacing: 0 8px;">
              <tr style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <td style="padding: 16px; border-radius: 12px 0 0 12px; text-align: center; font-size: 28px; width: 60px;">🥇</td>
                <td style="padding: 16px; font-weight: bold; font-size: 20px; width: 100px;">{{ states('input_number.peak_1_verdi') | round(2) }} kWh</td>
                <td style="padding: 16px; border-radius: 0 12px 12px 0; color: #333; font-size: 14px;">{{ states('input_text.peak_1_tidspunkt') }}</td>
              </tr>
              <tr style="background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%); color: #1a1a1a; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
                <td style="padding: 14px; border-radius: 12px 0 0 12px; text-align: center; font-size: 24px; width: 60px;">🥈</td>
                <td style="padding: 14px; font-weight: bold; font-size: 18px; width: 100px;">{{ states('input_number.peak_2_verdi') | round(2) }} kWh</td>
                <td style="padding: 14px; border-radius: 0 12px 12px 0; color: #333; font-size: 13px;">{{ states('input_text.peak_2_tidspunkt') }}</td>
              </tr>
              <tr style="background: linear-gradient(135deg, #CD7F32 0%, #B8732A 100%); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
                <td style="padding: 14px; border-radius: 12px 0 0 12px; text-align: center; font-size: 22px; width: 60px;">🥉</td>
                <td style="padding: 14px; font-weight: bold; font-size: 16px; width: 100px;">{{ states('input_number.peak_3_verdi') | round(2) }} kWh</td>
                <td style="padding: 14px; border-radius: 0 12px 12px 0; color: #f0f0f0; font-size: 13px;">{{ states('input_text.peak_3_tidspunkt') }}</td>
              </tr>
            </table>

            <div style="margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.5); border-radius: 8px; text-align: center;">
              <div style="font-size: 18px; font-weight: bold; color: #1a1a1a; margin-bottom: 4px;">
                {{ states('sensor.kapasitetsledd_aktuelt') }} kW
              </div>
              <div style="font-size: 13px; color: #666;">
                ({{ states('input_number.peak_1_verdi') | float | round(2) }} + {{ states('input_number.peak_2_verdi') | float | round(2) }} + {{ states('input_number.peak_3_verdi') | float | round(2) }}) ÷ 3
              </div>
            </div>

            <div style="margin-top: 10px; padding: 10px; background: {% set trinn = state_attr('sensor.kapasitetsledd_trinn', 'trinn_nummer') | int(1) %}{% if trinn == 1 %}rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50{% elif trinn == 2 %}rgba(33, 150, 243, 0.1); border-left: 4px solid #2196F3{% elif trinn == 3 %}rgba(255, 152, 0, 0.1); border-left: 4px solid #FF9800{% else %}rgba(244, 67, 54, 0.1); border-left: 4px solid #F44336{% endif %}; border-radius: 8px;">
              <div style="font-size: 14px; color: #1a1a1a; font-weight: bold;">
                {{ states('sensor.kapasitetsledd_trinn') }} = {{ states('sensor.kapasitetsledd_kostnad') }} kr/mnd
              </div>
              <div style="font-size: 12px; color: #666; margin-top: 4px;">
                Margin til neste trinn: {{ states('sensor.kapasitetsledd_margin_til_trinn') }} kW
              </div>
            </div>

            <div style="margin-top: 10px; padding: 10px; background: rgba(76, 175, 80, 0.1); border-left: 4px solid #4CAF50; border-radius: 8px;">
              <div style="font-size: 14px; color: #1a1a1a;">
                <strong>📅 I dag (hittil):</strong> {{ states('sensor.dagens_maks_hittil') | float | round(2) }} kWh
              </div>
              <div style="font-size: 14px; color: #1a1a1a; margin-top: 4px;">
                <strong>⏱️ Denne time:</strong> {{ states('sensor.p1_timeforbruk_korrekt') | float | round(2) }} kWh
              </div>
            </div>
          </div>
      - type: markdown
        content: |
          ## Høyeffektsenheter
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: switch.heavy_duty_switch
            name: VVB
            icon: mdi:water-boiler
            show_state: true
            show_label: true
            label: |
              [[[
                const peakDisabled = states['input_boolean.peak_kontroll_vvb_deaktivert'].state == 'on';
                if (peakDisabled) return '⚠️ Kuttet';
                return '✅ Auto';
              ]]]
            styles:
              card:
                - height: 90px
                - border-radius: 16px
              icon:
                - width: 35px
                - color: |
                    [[[
                      const disabled = states['input_boolean.peak_kontroll_vvb_deaktivert'].state == 'on';
                      const power = parseFloat(states['sensor.heavy_duty_switch_electric_consumption_w'].state);
                      if (disabled) return '#FF5722';
                      if (power > 5) return '#4CAF50';
                      if (entity.state == 'on') return '#2196F3';
                      return 'var(--disabled-color)';
                    ]]]
            tap_action:
              action: toggle
          - type: custom:button-card
            entity: switch.shellyplus1pm_a8032ab13280
            name: Billader
            icon: mdi:car-electric
            show_state: true
            show_label: true
            label: |
              [[[
                const overheat = states['input_boolean.overoppheting_billader_deaktivert'].state == 'on';
                const disabled = states['input_boolean.peak_kontroll_billader_deaktivert'].state == 'on';
                if (overheat) return '🔥 Overheat';
                if (disabled) return '⚠️ Kuttet';
                return '✅ Auto';
              ]]]
            styles:
              card:
                - height: 90px
                - border-radius: 16px
              icon:
                - width: 35px
                - color: |
                    [[[
                      const overheat = states['input_boolean.overoppheting_billader_deaktivert'].state == 'on';
                      const disabled = states['input_boolean.peak_kontroll_billader_deaktivert'].state == 'on';
                      const power = parseFloat(states['sensor.shellyplus1pm_a8032ab13280_power'].state);
                      if (overheat) return '#FF9800';
                      if (disabled) return '#FF5722';
                      if (power > 5) return '#4CAF50';
                      if (entity.state == 'on') return '#2196F3';
                      return 'var(--disabled-color)';
                    ]]]
            tap_action:
              action: toggle
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: climate.floor_thermostat
            name: Badegulv
            icon: mdi:radiator
            show_state: true
            show_label: true
            label: |
              [[[
                const disabled = states['input_boolean.peak_kontroll_badegulv_deaktivert'].state == 'on';
                if (disabled) return '⚠️ Kuttet';
                return '✅ Auto';
              ]]]
            styles:
              card:
                - height: 90px
                - border-radius: 16px
              icon:
                - width: 35px
                - color: |
                    [[[
                      const disabled = states['input_boolean.peak_kontroll_badegulv_deaktivert'].state == 'on';
                      if (disabled) return '#FF5722';
                      if (states['switch.floor_thermostat'].state == 'on') return '#4CAF50';
                      if (entity.state == 'heat') return '#2196F3';
                      return 'var(--disabled-color)';
                    ]]]
            tap_action:
              action: more-info
          - type: custom:button-card
            entity: climate.daikinap54875_room_temperature
            name: VP Stue
            icon: mdi:heat-pump
            show_state: true
            show_label: true
            label: |
              [[[
                const disabled = states['input_boolean.peak_kontroll_vp_stue_deaktivert'].state == 'on';
                if (disabled) return '⚠️ Kuttet';
                return '✅ Auto';
              ]]]
            styles:
              card:
                - height: 90px
                - border-radius: 16px
              icon:
                - width: 35px
                - color: |
                    [[[
                      const disabled = states['input_boolean.peak_kontroll_vp_stue_deaktivert'].state == 'on';
                      if (disabled) return '#FF5722';
                      if (entity.state != 'off') return '#4CAF50';
                      return 'var(--disabled-color)';
                    ]]]
            tap_action:
              action: more-info
          - type: custom:button-card
            entity: climate.vp_datarom
            name: VP Kontor
            icon: mdi:heat-pump
            show_state: true
            show_label: true
            label: |
              [[[
                const disabled = states['input_boolean.peak_kontroll_vp_kontor_deaktivert'].state == 'on';
                if (disabled) return '⚠️ Kuttet';
                return '✅ Auto';
              ]]]
            styles:
              card:
                - height: 90px
                - border-radius: 16px
              icon:
                - width: 35px
                - color: |
                    [[[
                      const disabled = states['input_boolean.peak_kontroll_vp_kontor_deaktivert'].state == 'on';
                      if (disabled) return '#FF5722';
                      if (entity.state != 'off') return '#4CAF50';
                      return 'var(--disabled-color)';
                    ]]]
            tap_action:
              action: more-info
      - type: custom:power-flow-card-plus
        entities:
          grid:
            entity: sensor.p1_meter_power
            name: Strømnett
            icon: mdi:transmission-tower
            color_icon: true
            display_zero: true
            unit_of_display: W
          home:
            entity: sensor.leilighet_restforbruk
            name: Leilighet
            color_icon: grid
            override_state: true
            icon: mdi:home
            display_zero: true
          individual:
            - entity: sensor.shellyplus1pm_a8032ab13280_power
              name: Billader
              icon: mdi:car-electric
              color: '#4a90e2'
              display_zero: false
              display_zero_tolerance: 5
              unit_of_display: W
            - entity: sensor.shellyplus1pm_a8032ab117c0_power
              name: Ventilasjon
              icon: mdi:fan
              color: '#50e3c2'
              display_zero: false
              display_zero_tolerance: 2
              unit_of_display: W
            - entity: sensor.heavy_duty_switch_electric_consumption_w
              name: Varmtvannsbereder
              icon: mdi:water-boiler
              color: '#f5a623'
              display_zero: false
              display_zero_tolerance: 5
              unit_of_display: W
            - entity: sensor.floor_thermostat_electric_consumption_w
              name: Badegulv
              icon: mdi:radiator
              color: '#d0021b'
              display_zero: false
              display_zero_tolerance: 1
              unit_of_display: W
            - entity: sensor.wiz_socket_d875d8_power
              name: Teknisk
              icon: mdi:server
              color: '#9b59b6'
              display_zero: false
              display_zero_tolerance: 2
              unit_of_display: W
            - entity: sensor.wiz_socket_da42ef_power
              name: Kaffetrakter
              icon: mdi:coffee-maker
              color: '#795548'
              display_zero: false
              display_zero_tolerance: 2
              unit_of_display: W
          fossil_fuel_percentage:
            entity: sensor.electricity_maps_grid_fossil_fuel_percentage
            name: Grønn
            state_type: percentage
            icon: mdi:leaf
            color_icon: true
            display_zero: true
            invert_value: true
            unit_of_display: '%'
        w_decimals: 0
        kw_decimals: 2
        watt_threshold: 1000
        min_flow_rate: 0.5
        max_flow_rate: 6
        clickable_entities: true
        use_new_flow_rate_model: true
        transparency_zero_lines: 0.3
        energy_date_selection: true
        title: Strømflyt
        animation: fade
        animation_speed: 2
        show_units: true
        show_states: true
        show_icons: true
        colors:
          grid_consumption: '#ef4444'
          grid_production: '#22c55e'
          home_consumption: '#3b82f6'
          individual_consumption: '#8b5cf6'
      - type: entities
        title: Detaljert
        show_header_toggle: false
        entities:
          - type: section
            label: Forbruk
          - entity: sensor.p1_meter_power
            name: Totalt
            icon: mdi:flash
          - entity: sensor.p1_timeforbruk_korrekt
            name: Denne timen
            icon: mdi:counter
          - entity: sensor.leilighet_restforbruk
            name: Restforbruk
            icon: mdi:home
          - type: section
            label: Faser
          - entity: sensor.p1_meter_current_phase_1
            name: L1
          - entity: sensor.p1_meter_current_phase_2
            name: L2
          - entity: sensor.p1_meter_current_phase_3
            name: L3
          - type: section
            label: Spenning
          - entity: sensor.p1_meter_voltage_phase_1
            name: L1
          - entity: sensor.p1_meter_voltage_phase_2
            name: L2
          - entity: sensor.p1_meter_voltage_phase_3
            name: L3
      - type: markdown
        content: |
          ## 👤 Person & Tracking
      - type: markdown
        content: >
          <div style="text-align: center; padding: 10px; background: {% if
          is_state('person.erik_narum', 'home') %}linear-gradient(135deg,
          #4CAF50 0%, #45a049 100%){% else %}linear-gradient(135deg, #FF9800 0%,
          #F57C00 100%){% endif %}; border-radius: 12px; color: white;
          font-size: 18px; font-weight: 600; margin: 10px 0;">
            {% if is_state('person.erik_narum', 'home') %}🏠 HJEMME{% else %}🚗 BORTE{% endif %}
          </div>
      - type: entities
        title: Person
        show_header_toggle: false
        state_color: true
        entities:
          - entity: person.erik_narum
            name: Status
            icon: mdi:account
          - type: attribute
            entity: person.erik_narum
            attribute: source
            name: Bruker tracker
            icon: mdi:radar
          - type: attribute
            entity: person.erik_narum
            attribute: latitude
            name: GPS Latitude
            icon: mdi:map-marker
          - type: attribute
            entity: person.erik_narum
            attribute: longitude
            name: GPS Longitude
            icon: mdi:map-marker
      - type: entities
        title: GPS Tracker
        show_header_toggle: false
        state_color: true
        entities:
          - entity: device_tracker.iphone_17pro
            name: Status
            icon: mdi:cellphone
          - type: attribute
            entity: device_tracker.iphone_17pro
            attribute: source_type
            name: Type
            icon: mdi:information
          - type: attribute
            entity: device_tracker.iphone_17pro
            attribute: latitude
            name: Latitude
            icon: mdi:crosshairs-gps
          - type: attribute
            entity: device_tracker.iphone_17pro
            attribute: longitude
            name: Longitude
            icon: mdi:crosshairs-gps
          - type: attribute
            entity: device_tracker.iphone_17pro
            attribute: gps_accuracy
            name: Nøyaktighet
            icon: mdi:target
            suffix: ' m'
      - type: custom:button-card
        entity: device_tracker.iphone_17pro
        name: Erik
        show_entity_picture: true
        entity_picture: /local/avatars/erik.png
        show_state: false
        custom_fields:
          status: |
            [[[
              const s = entity.state;
              const home = s === 'home' ? 'Hjemme' : (s === 'not_home' ? 'Borte' : (s || 'Ukjent'));
              const batt = parseFloat(states['sensor.iphone_17pro_battery_level']?.state);
              const battTxt = isNaN(batt) ? '' : ` • ${Math.round(batt)}%`;
              return home + battTxt;
            ]]]
        styles:
          card:
            - padding: 14px
            - border-radius: 16px
            - border: 2px solid var(--divider-color)
          grid:
            - grid-template-areas: '"i n" "i status"'
            - grid-template-columns: 60px 1fr
            - column-gap: 12px
          img_cell:
            - width: 60px
            - height: 60px
            - border-radius: 50%
            - background: |
                [[[
                  const v = parseFloat(states['sensor.iphone_17pro_battery_level']?.state);
                  const pct = isNaN(v) ? 0 : Math.round(v);
                  const col = entity.state === 'home' ? '#4CAF50' : '#FF9800';
                  return `conic-gradient(${col} 0 ${pct}%, var(--divider-color) ${pct}% 100%)`;
                ]]]
          picture:
            - border-radius: 50%
            - width: 54px
            - height: 54px
            - margin: 3px
          name:
            - font-weight: 700
            - font-size: 1.05rem
          custom_fields:
            status:
              - font-size: 0.9rem
              - padding: 2px 8px
              - border-radius: 999px
              - background: |
                  [[[
                    return entity.state === 'home' ? 'rgba(76,175,80,0.18)' : 'rgba(255,193,7,0.20)';
                  ]]]
              - color: |
                  [[[
                    return entity.state === 'home' ? '#4CAF50' : '#FF9800';
                  ]]]
        tap_action:
          action: more-info
        state:
          - value: home
            styles:
              card:
                - border: 2px solid var(--google-green-500)
          - value: not_home
            styles:
              card:
                - border: 2px solid var(--google-yellow-500)
      - type: markdown
        content: |
          ## Lys
      - type: horizontal-stack
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.lys_gang
            name: Gang lys
            icon: mdi:lightbulb
            slider_live_update: true
            tap_action:
              action: toggle
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.lys_hovedsoverom
            name: Soverom
            icon: mdi:bed
            slider_live_update: true
            tap_action:
              action: toggle
