# ===================================================================
# HOME ASSISTANT AUTOMATIONS
# Komplett fil med kapasitetsledd-system v3.0
# ===================================================================
# Holder deg under 5 kW kapasitetsledd med riktig norsk formel:
# Kapasitetsledd = (Peak #1 + Peak #2 + Peak #3) / 3
# ===================================================================

# ===================================================================
# KAPASITETSLEDD: SMART PEAK-KONTROLL (NY!)
# ===================================================================
- id: kapasitetsledd_smart_peak_kontroll
  alias: "Kapasitetsledd - Smart peak-kontroll"
  description: >
    Kutter laster basert på EKTE kapasitetsledd-logikk:
    - Kutt kun hvis prognosen faktisk vil øke kapasitetsleddet over målgrense
    - Tar hensyn til eksisterende topp-3 timer
    - Smart logikk avhengig av hvor i måneden vi er
  mode: single

  trigger:
    # Trigger når prognosen overstiger trygg grense
    - platform: template
      value_template: >
        {% set prognose = states('sensor.prognose_for_innevaerende_time') | float(0) %}
        {% set trygg = states('sensor.kapasitetsledd_trygg_grense') | float(0) %}
        {{ prognose > trygg }}
      for:
        minutes: "{{ states('input_number.kapasitetsledd_kutt_hysterese_min') | int(2) }}"

    # Periodisk sjekk (hver 5. minutt)
    - platform: time_pattern
      minutes: "/5"

  condition:
    # Kun kutt hvis anbefaling sier "KUTT NÅ!"
    - condition: state
      entity_id: sensor.kapasitetsledd_kutt_anbefaling
      state: "KUTT NÅ!"

    # Og vi har minst én enhet vi kan kutte
    - condition: or
      conditions:
        - condition: state
          entity_id: switch.heavy_duty_switch
          state: "on"
        - condition: state
          entity_id: switch.shellyplus1pm_a8032ab13280
          state: "on"
        - condition: state
          entity_id: climate.floor_thermostat
          state: "heat"
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.daikinap54875_room_temperature
              state: "off"
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.vp_datarom
              state: "off"

  action:
    - variables:
        prognose: "{{ states('sensor.prognose_for_innevaerende_time') | float(0) }}"
        hvis_prognose: "{{ states('sensor.kapasitetsledd_hvis_prognose') | float(0) }}"
        aktuelt: "{{ states('sensor.kapasitetsledd_aktuelt') | float(0) }}"
        maal: "{{ states('input_number.kapasitetsledd_maal') | float(5.0) }}"

    - service: persistent_notification.create
      data:
        title: "⚡ Kapasitetsledd - Kutter laster"
        message: >
          Prognose: {{ prognose }} kWh/time

          Kapasitetsledd NÅ: {{ aktuelt }} kW
          Kapasitetsledd HVIS: {{ hvis_prognose }} kW
          Målgrense: {{ maal }} kW

          {{ state_attr('sensor.kapasitetsledd_kutt_anbefaling', 'grunn') }}

          Kutter neste tilgjengelige last i prioritert rekkefølge...

    - choose:
        # 1) VVB (høyest effekt, kuttes først)
        - conditions:
            - condition: state
              entity_id: switch.heavy_duty_switch
              state: "on"
            - condition: template
              value_template: "{{ states('switch.heavy_duty_switch') not in ['unavailable', 'unknown'] }}"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.heavy_duty_switch
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.vvb_smart_styring_aktiv
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.peak_kontroll_vvb_deaktivert
            - service: persistent_notification.create
              data:
                title: "⚡ Kapasitetsledd - VVB kuttet"
                message: >
                  VVB deaktivert for å holde kapasitetsledd under {{ maal }} kW.
                  Prognose var {{ prognose }} kWh.
            - service: system_log.write
              data:
                message: "Kapasitetsledd: VVB kuttet (prognose={{ prognose }}, hvis={{ hvis_prognose }}, mål={{ maal }})"
                level: warning
            - delay: "00:03:00"

        # 2) Elbillader
        - conditions:
            - condition: state
              entity_id: switch.shellyplus1pm_a8032ab13280
              state: "on"
            - condition: template
              value_template: "{{ states('switch.shellyplus1pm_a8032ab13280') not in ['unavailable', 'unknown'] }}"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.shellyplus1pm_a8032ab13280
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.peak_kontroll_billader_deaktivert
            - service: persistent_notification.create
              data:
                title: "⚡ Kapasitetsledd - Billader pauset"
                message: >
                  Elbil-lading pauset for å holde kapasitetsledd under {{ maal }} kW.
            - service: system_log.write
              data:
                message: "Kapasitetsledd: Billader kuttet (prognose={{ prognose }})"
                level: warning
            - delay: "00:03:00"

        # 3) Varmekabler bad
        - conditions:
            - condition: state
              entity_id: climate.floor_thermostat
              state: "heat"
            - condition: template
              value_template: "{{ states('climate.floor_thermostat') not in ['unavailable', 'unknown'] }}"
          sequence:
            - service: climate.turn_off
              target:
                entity_id: climate.floor_thermostat
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.peak_kontroll_badegulv_deaktivert
            - service: persistent_notification.create
              data:
                title: "⚡ Kapasitetsledd - Badegulv kuttet"
                message: >
                  Varmekabler bad deaktivert for å holde kapasitetsledd under {{ maal }} kW.
            - service: system_log.write
              data:
                message: "Kapasitetsledd: Badegulv kuttet (prognose={{ prognose }})"
                level: warning
            - delay: "00:03:00"

        # 4) Varmepumpe stue
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.daikinap54875_room_temperature
                  state: "off"
            - condition: template
              value_template: "{{ states('climate.daikinap54875_room_temperature') not in ['unavailable', 'unknown'] }}"
          sequence:
            - service: climate.turn_off
              target:
                entity_id: climate.daikinap54875_room_temperature
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.peak_kontroll_vp_stue_deaktivert
            - service: persistent_notification.create
              data:
                title: "⚡ Kapasitetsledd - VP Stue kuttet"
                message: >
                  Varmepumpe stue deaktivert for å holde kapasitetsledd under {{ maal }} kW.
            - service: system_log.write
              data:
                message: "Kapasitetsledd: VP Stue kuttet (prognose={{ prognose }})"
                level: warning
            - delay: "00:03:00"

        # 5) Varmepumpe kontor
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.vp_datarom
                  state: "off"
            - condition: template
              value_template: "{{ states('climate.vp_datarom') not in ['unavailable', 'unknown'] }}"
          sequence:
            - service: climate.turn_off
              target:
                entity_id: climate.vp_datarom
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
            - service: persistent_notification.create
              data:
                title: "⚡ Kapasitetsledd - VP Kontor kuttet"
                message: >
                  Varmepumpe kontor deaktivert for å holde kapasitetsledd under {{ maal }} kW.
            - service: system_log.write
              data:
                message: "Kapasitetsledd: VP Kontor kuttet (prognose={{ prognose }})"
                level: warning
            - delay: "00:03:00"


# ===================================================================
# KAPASITETSLEDD: NORMALISERING (NY!)
# ===================================================================
- id: kapasitetsledd_normalisering
  alias: "Kapasitetsledd - Normalisering"
  description: >
    Skrur forsiktig på enheter igjen når det er trygt.
    Bruker trygg grense basert på nåværende topp-3.
  mode: single

  trigger:
    # Trigger når prognosen er under trygg grense
    - platform: template
      value_template: >
        {% set prognose = states('sensor.prognose_for_innevaerende_time') | float(0) %}
        {% set trygg = states('sensor.kapasitetsledd_trygg_grense') | float(0) %}
        {{ prognose < (trygg - 0.5) }}
      for:
        minutes: "{{ states('input_number.kapasitetsledd_gjenopprett_hysterese_min') | int(5) }}"

    # Periodisk sjekk
    - platform: time_pattern
      minutes: "/5"

  condition:
    - condition: template
      value_template: >
        {% set prognose = states('sensor.prognose_for_innevaerende_time') | float(0) %}
        {% set trygg = states('sensor.kapasitetsledd_trygg_grense') | float(0) %}
        {{ prognose < (trygg - 0.5) }}
    - condition: state
      entity_id: sensor.kapasitetsledd_kutt_anbefaling
      state: "TRYGT"

  action:
    # Gjenopprett i OMVENDT rekkefølge (lavest effekt først)

    # 1) VP Kontor først
    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
          state: "on"
      then:
        - service: climate.turn_on
          target:
            entity_id: climate.vp_datarom
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
        - service: persistent_notification.create
          data:
            title: "✅ Kapasitetsledd - VP Kontor gjenopprettet"
            message: >
              Prognose {{ states('sensor.prognose_for_innevaerende_time') }} kWh er trygg.
              Kapasitetsledd {{ states('sensor.kapasitetsledd_aktuelt') }} kW.
        - delay: "00:02:00"

    # 2) VP Stue
    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_vp_stue_deaktivert
          state: "on"
      then:
        - service: climate.turn_on
          target:
            entity_id: climate.daikinap54875_room_temperature
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_vp_stue_deaktivert
        - service: persistent_notification.create
          data:
            title: "✅ Kapasitetsledd - VP Stue gjenopprettet"
            message: "Varmepumpe stue aktivert igjen."
        - delay: "00:02:00"

    # 3) Badegulv
    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_badegulv_deaktivert
          state: "on"
      then:
        - service: climate.turn_on
          target:
            entity_id: climate.floor_thermostat
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_badegulv_deaktivert
        - service: persistent_notification.create
          data:
            title: "✅ Kapasitetsledd - Badegulv gjenopprettet"
            message: "Varmekabler bad aktivert igjen."
        - delay: "00:02:00"

    # 4) Billader
    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_billader_deaktivert
          state: "on"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.shellyplus1pm_a8032ab13280
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_billader_deaktivert
        - service: persistent_notification.create
          data:
            title: "✅ Kapasitetsledd - Billader gjenopprettet"
            message: "Elbil-lading gjenopptatt."
        - delay: "00:02:00"

    # 5) VVB sist (høyest effekt)
    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_vvb_deaktivert
          state: "on"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.heavy_duty_switch
        - service: input_boolean.turn_on
          target:
            entity_id: input_boolean.vvb_smart_styring_aktiv
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_vvb_deaktivert
        - service: persistent_notification.create
          data:
            title: "✅ Kapasitetsledd - VVB gjenopprettet"
            message: "VVB og smart styring aktivert igjen."


# ===================================================================
# SYSTEM OPPSTART - NORMALISERING
# ===================================================================
- id: system_oppstart_normaliser
  alias: "System-oppstart - Normaliser enheter"
  description: "Gjenoppretter enheter ved oppstart hvis trygt."
  mode: single
  trigger:
    - platform: homeassistant
      event: start
  action:
    - delay: "00:01:00"
    - condition: state
      entity_id: sensor.kapasitetsledd_kutt_anbefaling
      state: "TRYGT"

    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
          state: "on"
      then:
        - service: climate.turn_on
          target:
            entity_id: climate.vp_datarom
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
    - delay: "00:00:10"

    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_vp_stue_deaktivert
          state: "on"
      then:
        - service: climate.turn_on
          target:
            entity_id: climate.daikinap54875_room_temperature
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_vp_stue_deaktivert
    - delay: "00:00:10"

    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_badegulv_deaktivert
          state: "on"
      then:
        - service: climate.turn_on
          target:
            entity_id: climate.floor_thermostat
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_badegulv_deaktivert
    - delay: "00:00:10"

    - if:
        - condition: and
          conditions:
            - condition: state
              entity_id: input_boolean.peak_kontroll_billader_deaktivert
              state: "on"
            - condition: state
              entity_id: input_boolean.overoppheting_billader_deaktivert
              state: "off"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.shellyplus1pm_a8032ab13280
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_billader_deaktivert
    - delay: "00:00:10"

    - if:
        - condition: state
          entity_id: input_boolean.peak_kontroll_vvb_deaktivert
          state: "on"
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.heavy_duty_switch
        - service: input_boolean.turn_on
          target:
            entity_id: input_boolean.vvb_smart_styring_aktiv
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.peak_kontroll_vvb_deaktivert


# ===================================================================
# EFFEKTLEDD: OPPDATER TOPP-3
# ===================================================================
- id: effektledd_oppdater_topper
  alias: "Effektledd - Oppdater topp-3"
  description: "Kjører 30 sek etter timeskiftet for å logge korrekt timeforbruk."
  mode: single
  trigger:
    - platform: time_pattern
      hours: "*"
      minutes: 0
      seconds: 30
  condition:
    - condition: template
      value_template: "{{ states('sensor.hourly_energy') not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        new_peak: "{{ states('sensor.hourly_energy') | float(0) }}"
        peak1: "{{ states('input_number.peak_1_verdi') | float(0) }}"
        peak2: "{{ states('input_number.peak_2_verdi') | float(0) }}"
        peak3: "{{ states('input_number.peak_3_verdi') | float(0) }}"
        timestamp: "{{ (now() - timedelta(hours=1)).strftime('%d.%m.%Y') }} (kl. {{ (now() - timedelta(hours=1)).strftime('%H') }}-{{ now().strftime('%H') }})"
    - choose:
        - conditions:
            - "{{ new_peak > peak1 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_3_verdi
              data:
                value: "{{ peak2 }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_3_tidspunkt
              data:
                value: "{{ states('input_text.peak_2_tidspunkt') }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_2_verdi
              data:
                value: "{{ peak1 }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_2_tidspunkt
              data:
                value: "{{ states('input_text.peak_1_tidspunkt') }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_1_verdi
              data:
                value: "{{ new_peak }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_1_tidspunkt
              data:
                value: "{{ timestamp }}"
            - service: persistent_notification.create
              data:
                title: "🏆 NY TOPP #1!"
                message: >
                  Ny topp: {{ new_peak }} kWh ({{ timestamp }})
                  Kapasitetsledd nå: {{ states('sensor.kapasitetsledd_aktuelt') }} kW
            - service: system_log.write
              data:
                message: "Ny peak #1: {{ new_peak }} kWh ({{ timestamp }})"
                level: info
        - conditions:
            - "{{ new_peak > peak2 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_3_verdi
              data:
                value: "{{ peak2 }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_3_tidspunkt
              data:
                value: "{{ states('input_text.peak_2_tidspunkt') }}"
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_2_verdi
              data:
                value: "{{ new_peak }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_2_tidspunkt
              data:
                value: "{{ timestamp }}"
            - service: persistent_notification.create
              data:
                title: "🥈 Ny topp #2"
                message: >
                  Ny topp: {{ new_peak }} kWh ({{ timestamp }})
                  Kapasitetsledd nå: {{ states('sensor.kapasitetsledd_aktuelt') }} kW
        - conditions:
            - "{{ new_peak > peak3 }}"
          sequence:
            - service: input_number.set_value
              target:
                entity_id: input_number.peak_3_verdi
              data:
                value: "{{ new_peak }}"
            - service: input_text.set_value
              target:
                entity_id: input_text.peak_3_tidspunkt
              data:
                value: "{{ timestamp }}"
            - service: persistent_notification.create
              data:
                title: "🥉 Ny topp #3"
                message: >
                  Ny topp: {{ new_peak }} kWh ({{ timestamp }})
                  Kapasitetsledd nå: {{ states('sensor.kapasitetsledd_aktuelt') }} kW

- id: effektledd_nullstill_topper
  alias: "Effektledd - Nullstill ved månedsskifte"
  description: "Nullstiller topp 3-verdiene den første i hver måned."
  mode: single
  trigger:
    - platform: time
      at: "00:01:00"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - service: input_number.set_value
      target:
        entity_id:
          - input_number.peak_1_verdi
          - input_number.peak_2_verdi
          - input_number.peak_3_verdi
      data:
        value: 0
    - service: input_text.set_value
      target:
        entity_id:
          - input_text.peak_1_tidspunkt
          - input_text.peak_2_tidspunkt
          - input_text.peak_3_tidspunkt
      data:
        value: "Ingen data"
    - service: persistent_notification.create
      data:
        title: "🔄 Effektledd nullstilt"
        message: "Ny måned - topp 3 nullstilt. Kapasitetsledd starter på nytt!"
    - service: system_log.write
      data:
        message: "Effektledd: Månedlige topper nullstilt"
        level: info


# ===================================================================
# SIKKERHET: OVEROPPHETING BILLADER
# ===================================================================
- id: sikkerhet_overoppheting_av_billader
  alias: "Overopphetingsvern - Skru AV Billader"
  description: "Skrur av billaderen hvis temperaturen overstiger 75°C."
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.shellyplus1pm_a8032ab13280_temperature
      above: 75
  condition:
    - condition: state
      entity_id: switch.shellyplus1pm_a8032ab13280
      state: "on"
    - condition: template
      value_template: "{{ states('sensor.shellyplus1pm_a8032ab13280_temperature') not in ['unavailable', 'unknown'] }}"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.shellyplus1pm_a8032ab13280
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.overoppheting_billader_deaktivert
    - service: persistent_notification.create
      data:
        title: "🔥 KRITISK SIKKERHETSADVARSEL"
        message: >
          Billaderen er overopphetet
          ({{ states('sensor.shellyplus1pm_a8032ab13280_temperature') }}°C > 75°C)
          og har blitt automatisk skrudd av!

- id: sikkerhet_overoppheting_paa_billader
  alias: "Overopphetingsvern - Skru PÅ Billader igjen"
  description: "Gjenopptar ladingen når temperaturen er under 60°C."
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.shellyplus1pm_a8032ab13280_temperature
      below: 60
  condition:
    - condition: state
      entity_id: input_boolean.overoppheting_billader_deaktivert
      state: "on"
    - condition: template
      value_template: "{{ states('sensor.shellyplus1pm_a8032ab13280_temperature') not in ['unavailable', 'unknown'] }}"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.shellyplus1pm_a8032ab13280
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.overoppheting_billader_deaktivert
    - service: persistent_notification.create
      data:
        title: "✅ Lading Gjenopptatt"
        message: >
          Temperaturen på billaderen er nå
          {{ states('sensor.shellyplus1pm_a8032ab13280_temperature') }}°C (< 60°C).
          Ladingen er gjenopptatt.


# ===================================================================
# ROBOTSTØVSUGERE
# ===================================================================
- id: manuell_start_stovsugere_nar_borte
  alias: "Start robotstøvsugere når jeg er borte"
  description: "Starter støvsugere når jeg er borte, maks én gang per 48 timer."
  mode: single
  trigger:
    - platform: state
      entity_id: device_tracker.iphone_17pro
      from: home
      to: not_home
      for: "00:10:00"
  condition:
    - condition: template
      value_template: >-
        {% set last_run = states('input_datetime.robot_siste_kjoring') %}
        {% if last_run in ['unknown', 'unavailable'] %}
          true
        {% else %}
          {{ (now() - (last_run | as_datetime | as_local)).total_seconds() > 172800 }}
        {% endif %}
    - condition: template
      value_template: >
        {{ states('vacuum.roborock_s7_maxv') not in ['unavailable', 'unknown'] and
           states('vacuum.nr_7') not in ['unavailable', 'unknown'] }}
  action:
    - service: system_log.write
      data:
        message: "Robotstøvsuger-automatisering trigget! Erik er borte."
        level: info

    - if:
        - condition: template
          value_template: >
            {{ state_attr('vacuum.roborock_s7_maxv', 'battery_level') | int(0) >= 20 }}
      then:
        - service: vacuum.start
          target:
            entity_id: vacuum.roborock_s7_maxv
        - service: system_log.write
          data:
            message: "Roborock S7 MaxV startet (batteri: {{ state_attr('vacuum.roborock_s7_maxv', 'battery_level') }}%)"
            level: info
      else:
        - service: system_log.write
          data:
            message: "Roborock S7 MaxV IKKE startet - lavt batteri ({{ state_attr('vacuum.roborock_s7_maxv', 'battery_level') }}%)"
            level: warning

    - if:
        - condition: template
          value_template: >
            {{ state_attr('vacuum.nr_7', 'battery_level') | int(0) >= 20 }}
      then:
        - service: vacuum.start
          target:
            entity_id: vacuum.nr_7
        - service: system_log.write
          data:
            message: "Nr 7 startet (batteri: {{ state_attr('vacuum.nr_7', 'battery_level') }}%)"
            level: info
      else:
        - service: system_log.write
          data:
            message: "Nr 7 IKKE startet - lavt batteri ({{ state_attr('vacuum.nr_7', 'battery_level') }}%)"
            level: warning

    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.robot_siste_kjoring
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"


# ===================================================================
# KINO-SYNKRONISERING
# ===================================================================
- id: kino_synk_alle_pa
  alias: "Kino: En på = alle på"
  description: "Slår på alle kino-enheter når én slås på."
  trigger:
    - platform: state
      entity_id:
        - media_player.shield_2
        - media_player.samsung_qn85ba_85_qe85qn85batxxc
        - media_player.rx_v685_3c03b4
      from: 'off'
      to: 'on'
  condition:
    - condition: state
      entity_id: input_boolean.kino_synkronisering
      state: 'on'
    - condition: template
      value_template: >
        {{ ['off', 'unavailable', 'unknown'] | intersect([
          states('media_player.shield_2'),
          states('media_player.samsung_qn85ba_85_qe85qn85batxxc'),
          states('media_player.rx_v685_3c03b4')
        ]) | length > 0 }}
  action:
    - service: media_player.turn_on
      target:
        entity_id:
          - media_player.shield_2
          - media_player.samsung_qn85ba_85_qe85qn85batxxc
          - media_player.rx_v685_3c03b4
    - wait_template: >
        {{ states('media_player.rx_v685_3c03b4') not in ['off', 'unavailable', 'unknown'] }}
      timeout:
        seconds: 45
      continue_on_timeout: true
    - delay:
        seconds: 5
    - if:
        - condition: template
          value_template: >
            {{ states('media_player.rx_v685_3c03b4') not in ['off', 'unavailable', 'unknown'] }}
      then:
        - service: media_player.volume_set
          target:
            entity_id: media_player.rx_v685_3c03b4
          data:
            volume_level: 0.575
  mode: single

- id: kino_synk_alle_av
  alias: "Kino: En av = alle av"
  description: "Slår av alle kino-enheter når én slås av."
  trigger:
    - platform: state
      entity_id:
        - media_player.shield_2
        - media_player.samsung_qn85ba_85_qe85qn85batxxc
        - media_player.rx_v685_3c03b4
      to: 'off'
      for:
        seconds: 2
  condition:
    - condition: state
      entity_id: input_boolean.kino_synkronisering
      state: 'on'
    - condition: template
      value_template: >
        {{ ['on', 'playing', 'paused', 'idle'] | intersect([
          states('media_player.shield_2'),
          states('media_player.samsung_qn85ba_85_qe85qn85batxxc'),
          states('media_player.rx_v685_3c03b4')
        ]) | length > 0 }}
  action:
    - service: media_player.turn_off
      target:
        entity_id:
          - media_player.shield_2
          - media_player.samsung_qn85ba_85_qe85qn85batxxc
          - media_player.rx_v685_3c03b4
  mode: single


# ===================================================================
# VARMEPUMPE DATAROM
# ===================================================================
- id: varmepumpe_datarom_dynamisk_fan_speed
  alias: "Varmepumpe Datarom - Dynamisk fan speed"
  description: "Justerer viftehastighet basert på temperaturavvik."
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/2"
    - platform: state
      entity_id: climate.vp_datarom
      attribute: current_temperature
    - platform: state
      entity_id: climate.vp_datarom
      attribute: temperature
  condition:
    - condition: state
      entity_id: climate.vp_datarom
      state: 'cool'
    - condition: state
      entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
      state: 'off'
    - condition: template
      value_template: "{{ states('climate.vp_datarom') not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        strong_on: 3.0
        strong_off: 2.5
        current_temp: "{{ state_attr('climate.vp_datarom', 'current_temperature') | float(0) }}"
        target_temp:  "{{ state_attr('climate.vp_datarom', 'temperature') | float(0) }}"
        temp_diff:    "{{ current_temp - target_temp }}"
        current_fan:  "{{ state_attr('climate.vp_datarom', 'fan_mode') | default('auto') }}"
    - choose:
        - conditions:
            - "{{ temp_diff > strong_on }}"
            - "{{ current_fan != 'strong' }}"
          sequence:
            - service: climate.set_fan_mode
              target:
                entity_id: climate.vp_datarom
              data:
                fan_mode: 'strong'
        - conditions:
            - "{{ temp_diff <= strong_off }}"
            - "{{ current_fan != 'auto' }}"
          sequence:
            - service: climate.set_fan_mode
              target:
                entity_id: climate.vp_datarom
              data:
                fan_mode: 'auto'

- id: varmepumpe_datarom_daglig_torkesyklus
  alias: "Varmepumpe Datarom - Daglig tørkesyklus"
  description: "Kjører tørkesyklus hver natt kl 03:00."
  mode: single
  trigger:
    - platform: time
      at: "03:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.peak_kontroll_vp_kontor_deaktivert
      state: 'off'
    - condition: template
      value_template: "{{ states('climate.vp_datarom') not in ['unavailable', 'unknown', 'off'] }}"
  action:
    - variables:
        previous_mode: "{{ states('climate.vp_datarom') }}"
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.vp_datarom
      data:
        hvac_mode: 'fan_only'
    - delay: "01:00:00"
    - if:
        - condition: template
          value_template: "{{ previous_mode in ['cool', 'heat', 'heat_cool'] }}"
      then:
        - service: climate.set_hvac_mode
          target:
            entity_id: climate.vp_datarom
          data:
            hvac_mode: "{{ previous_mode }}"
      else:
        - service: climate.set_hvac_mode
          target:
            entity_id: climate.vp_datarom
          data:
            hvac_mode: 'cool'


# ===================================================================
# GANG LYS
# ===================================================================
- id: gang_lys_smart_justering
  alias: "Gang lys - Smart justering"
  description: "Justerer lys basert på tid - maks lysstyrke dag, rødt natt."
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/15"
    - platform: state
      entity_id: light.lys_gang
      from: "off"
      to: "on"
  condition:
    - condition: state
      entity_id: light.lys_gang
      state: "on"
    - condition: template
      value_template: "{{ states('light.lys_gang') not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        current_hour: "{{ now().hour }}"
        current_minute: "{{ now().minute }}"
        is_weekday: "{{ now().weekday() < 5 }}"
        is_night: >
          {% if current_hour >= 22 %}
            true
          {% elif current_hour < 6 %}
            true
          {% elif current_hour == 6 and is_weekday and current_minute < 30 %}
            true
          {% elif current_hour == 6 and not is_weekday %}
            true
          {% else %}
            false
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_night }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: 8
                rgb_color: [255, 0, 0]
                transition: 5
      default:
        - service: light.turn_on
          target:
            entity_id: light.lys_gang
          data:
            brightness: 254
            color_temp_kelvin: 2702
            transition: 5

- id: gang_lys_nattemodus_overgang
  alias: "Gang lys - Nattemodus overgang"
  description: "Bytter mellom dag/natt-modus på riktig tid."
  mode: single
  trigger:
    - platform: time
      at: "22:00:00"
      id: "start_night"
    - platform: time
      at: "06:30:00"
      id: "end_night_weekday"
    - platform: time
      at: "07:00:00"
      id: "end_night_weekend"
  condition:
    - condition: state
      entity_id: light.lys_gang
      state: "on"
    - condition: template
      value_template: "{{ states('light.lys_gang') not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        is_weekday: "{{ now().weekday() < 5 }}"
    - choose:
        - conditions:
            - condition: trigger
              id: "start_night"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: 8
                rgb_color: [255, 0, 0]
                transition: 10
        - conditions:
            - condition: trigger
              id: "end_night_weekday"
            - condition: template
              value_template: "{{ is_weekday }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: 254
                color_temp_kelvin: 2702
                transition: 10
        - conditions:
            - condition: trigger
              id: "end_night_weekend"
            - condition: template
              value_template: "{{ not is_weekday }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.lys_gang
              data:
                brightness: 254
                color_temp_kelvin: 2702
                transition: 10
