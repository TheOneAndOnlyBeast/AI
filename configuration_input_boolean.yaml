# ===================================================================
# HOME ASSISTANT INPUT_BOOLEAN HJELPERE
# Versjon: 2.0
# ===================================================================
# Disse boolean hjelperne brukes for å holde styr på tilstanden
# til enheter som er kuttet av peak-kontroll eller sikkerhetssystemer.
#
# Legg til i configuration.yaml med: input_boolean: !include configuration_input_boolean.yaml
# Eller opprett dem via UI: Innstillinger > Enheter og tjenester > Hjelpere
# ===================================================================

input_boolean:
  # ===================================================================
  # VVB (VARMTVANNSBEHOLDER)
  # ===================================================================
  vvb_smart_styring_aktiv:
    name: "VVB - Smart styring aktiv"
    icon: mdi:water-boiler
    initial: true

  peak_kontroll_vvb_deaktivert:
    name: "Peak-kontroll - VVB deaktivert"
    icon: mdi:water-boiler-off
    initial: false

  # ===================================================================
  # ELBILLADER
  # ===================================================================
  peak_kontroll_billader_deaktivert:
    name: "Peak-kontroll - Billader deaktivert"
    icon: mdi:ev-station
    initial: false

  overoppheting_billader_deaktivert:
    name: "Overoppheting - Billader deaktivert"
    icon: mdi:alert-circle
    initial: false

  # ===================================================================
  # VARMEKABLER BAD
  # ===================================================================
  peak_kontroll_badegulv_deaktivert:
    name: "Peak-kontroll - Badegulv deaktivert"
    icon: mdi:radiator-disabled
    initial: false

  # ===================================================================
  # VARMEPUMPE STUE
  # ===================================================================
  peak_kontroll_vp_stue_deaktivert:
    name: "Peak-kontroll - VP Stue deaktivert"
    icon: mdi:air-conditioner
    initial: false

  # ===================================================================
  # VARMEPUMPE KONTOR/DATAROM
  # ===================================================================
  peak_kontroll_vp_kontor_deaktivert:
    name: "Peak-kontroll - VP Kontor deaktivert"
    icon: mdi:air-conditioner
    initial: false

  # ===================================================================
  # KINO-SYSTEM
  # ===================================================================
  kino_synkronisering:
    name: "Kino - Synkronisering aktiv"
    icon: mdi:television
    initial: true


# ===================================================================
# EKSISTERENDE INPUT_DATETIME (referanse - må finnes allerede)
