# ===================================================================
# HOME ASSISTANT CONFIGURATION.YAML
# Komplett fil med kapasitetsledd-system
# ===================================================================

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Includes for automations, scripts, etc.
automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

# ===================================================================
# INPUT_BOOLEAN
# ===================================================================
input_boolean:
  # VVB
  vvb_smart_styring_aktiv:
    name: "VVB Smart Styring Aktiv"
    initial: true
    icon: mdi:water-boiler-auto

  # Peak-kontroll flags
  peak_kontroll_vvb_deaktivert:
    name: "Peak-kontroll - VVB deaktivert"
    icon: mdi:water-boiler-off
    initial: false

  peak_kontroll_billader_deaktivert:
    name: "Peak-kontroll - Billader deaktivert"
    icon: mdi:ev-station
    initial: false

  overoppheting_billader_deaktivert:
    name: "Overoppheting - Billader deaktivert"
    icon: mdi:alert-circle
    initial: false

  peak_kontroll_badegulv_deaktivert:
    name: "Peak-kontroll - Badegulv deaktivert"
    icon: mdi:radiator-disabled
    initial: false

  peak_kontroll_vp_stue_deaktivert:
    name: "Peak-kontroll - VP Stue deaktivert"
    icon: mdi:air-conditioner
    initial: false

  peak_kontroll_vp_kontor_deaktivert:
    name: "Peak-kontroll - VP Kontor deaktivert"
    icon: mdi:air-conditioner
    initial: false

  kino_synkronisering:
    name: "Kino - Synkronisering aktiv"
    icon: mdi:television
    initial: true

# ===================================================================
# INPUT_NUMBER
# ===================================================================
input_number:
  # Effektledd tracking (eksisterende)
  peak_1_verdi:
    name: "Effektledd - Peak #1 verdi"
    min: 0
    max: 50
    step: 0.01
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:gauge

  peak_2_verdi:
    name: "Effektledd - Peak #2 verdi"
    min: 0
    max: 50
    step: 0.01
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:gauge

  peak_3_verdi:
    name: "Effektledd - Peak #3 verdi"
    min: 0
    max: 50
    step: 0.01
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:gauge

  # NYE: Kapasitetsledd-system
  kapasitetsledd_maal:
    name: "Kapasitetsledd - Målgrense"
    min: 2.0
    max: 25.0
    step: 0.5
    initial: 5.0
    unit_of_measurement: "kW"
    mode: box
    icon: mdi:target

  forrige_time_forbruk:
    name: "Forrige time - Forbruk"
    min: 0
    max: 50
    step: 0.01
    initial: 0
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:clock-time-eight

  kapasitetsledd_kutt_hysterese_min:
    name: "Kapasitetsledd - Kutt hysterese (minutter)"
    min: 1
    max: 10
    step: 1
    initial: 2
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand

  kapasitetsledd_gjenopprett_hysterese_min:
    name: "Kapasitetsledd - Gjenopprett hysterese (minutter)"
    min: 2
    max: 10
    step: 1
    initial: 5
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-check

# ===================================================================
# INPUT_TEXT
# ===================================================================
input_text:
  peak_1_tidspunkt:
    name: "Effektledd - Peak #1 tidspunkt"
    initial: "Ingen data"
    icon: mdi:clock-outline

  peak_2_tidspunkt:
    name: "Effektledd - Peak #2 tidspunkt"
    initial: "Ingen data"
    icon: mdi:clock-outline

  peak_3_tidspunkt:
    name: "Effektledd - Peak #3 tidspunkt"
    initial: "Ingen data"
    icon: mdi:clock-outline

# ===================================================================
# INPUT_DATETIME
# ===================================================================
input_datetime:
  robot_siste_kjoring:
    name: "Robotstøvsuger - Siste kjøring"
    has_date: true
    has_time: true
    icon: mdi:robot-vacuum

# ===================================================================
# REST-SENSOR: Maren tømmekalender (skrudd av pga nede)
# ===================================================================
sensor:
#  - platform: rest
#    name: "Maren neste tømming"
#    unique_id: maren_neste_tomming
#    resource: https://kalender.maren.no/maren/v1/tomminger/ccd09b31-e915-4647-98d0-e70723eadf63?future=true&future_months=2
#    method: GET
#    headers:
#      accept: application/json
#    value_template: "{{ value_json.datoer[0].dato }}"
#    json_attributes:
#      - datoer

  # ===================================================================
  # WIZ ENERGY SENSORER (konverterer power til energy)
  # ===================================================================
  - platform: integration
    source: sensor.wiz_socket_d875d8_power
    name: "WiZ Socket 1 Energy"
    unique_id: wiz_socket_d875d8_energy
    unit_prefix: k
    round: 2
    method: left

  - platform: integration
    source: sensor.wiz_socket_da42ef_power
    name: "WiZ Socket 2 Energy"
    unique_id: wiz_socket_da42ef_energy
    unit_prefix: k
    round: 2
    method: left

# ===================================================================
# UTILITY METERS for timeforbruk
# ===================================================================
utility_meter:
  hourly_energy:
    source: sensor.p1_meter_energy_import
    cycle: hourly

  daily_energy:
    source: sensor.p1_meter_energy_import
    cycle: daily

  monthly_energy:
    source: sensor.p1_meter_energy_import
    cycle: monthly

# ===================================================================
# TEMPLATE-SENSORER
# ===================================================================
template:
  - sensor:
      # ===================================================================
      # EKSISTERENDE SENSORER (uendret)
      # ===================================================================

      # Restforbruk leilighet
      - name: "Leilighet (restforbruk)"
        unique_id: leilighet_restforbruk_avansert
        state: >
          {% set total = states('sensor.p1_meter_power') | float(0) %}
          {% set bil = states('sensor.shellyplus1pm_a8032ab13280_power') | float(0) %}
          {% set ventilasjon = states('sensor.shellyplus1pm_a8032ab117c0_power') | float(0) %}
          {% set vvb = states('sensor.heavy_duty_switch_electric_consumption_w') | float(0) %}
          {% set bad_gulv = states('sensor.floor_thermostat_electric_consumption_w') | float(0) %}
          {{ total - bil - ventilasjon - vvb - bad_gulv }}
        unit_of_measurement: 'W'
        device_class: power
        state_class: measurement

      # Prognose basert på P1 meter
      - name: "Prognose for inneværende time"
        unique_id: prognose_for_timen_p1
        unit_of_measurement: "kWh"
        icon: mdi:lightning-bolt
        state: >
          {% set consumed = states('sensor.hourly_energy') | float(0) %}
          {% set current_power = states('sensor.p1_meter_power') | float(0) / 1000 %}
          {% set minutes_left = 60 - now().minute %}
          {% set projected = (current_power * minutes_left / 60) %}
          {{ (consumed + projected) | round(2) }}

      # Neste søppeldag
      - name: "Neste søppeldag"
        unique_id: neste_soppeldag_dato
        state: >
          {% set dato = states('sensor.maren_neste_tomming') %}
          {% if dato not in ['unknown', 'unavailable', 'none'] %}
            {{ as_datetime(dato).day }}. {{ as_datetime(dato).strftime('%b') | lower }}
          {% else %}
            Ukjent
          {% endif %}

      # Type søppel
      - name: "Type søppel neste gang"
        unique_id: type_soppel_neste_gang
        state: >
          {% set attr = state_attr('sensor.maren_neste_tomming', 'datoer') %}
          {% if attr and attr[0] %}
            {{ attr[0].fraksjon }}
          {% else %}
            Ukjent
          {% endif %}

      # Gang lys info
      - name: "Gang lys info"
        unique_id: gang_lys_status_info
        state: >
          {% if is_state('light.lys_gang', 'off') %}
            Av
          {% else %}
            {% set brightness = (state_attr('light.lys_gang', 'brightness') | float(0) / 255 * 100) | round(0) | int %}
            {% set color_temp = state_attr('light.lys_gang', 'color_temp_kelvin') %}
            {% set rgb = state_attr('light.lys_gang', 'rgb_color') %}

            {% if color_temp is not none %}
              {{ brightness }}% - {{ color_temp }}K
            {% elif rgb is not none %}
              {% if rgb == [255, 0, 0] %}
                {{ brightness }}% - Nattmodus
              {% else %}
                {{ brightness }}% - RGB
              {% endif %}
            {% else %}
              {{ brightness }}%
            {% endif %}
          {% endif %}
        icon: >
          {% if is_state('light.lys_gang', 'off') %}
            mdi:lightbulb-off
          {% elif state_attr('light.lys_gang', 'rgb_color') == [255, 0, 0] %}
            mdi:lightbulb-night
          {% else %}
            mdi:lightbulb-on
          {% endif %}

      # ===================================================================
      # NYE: KAPASITETSLEDD-SENSORER
      # ===================================================================

      # Aktuelt kapasitetsledd (gjennomsnitt av topp-3)
      - name: "Kapasitetsledd aktuelt"
        unique_id: kapasitetsledd_aktuelt
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower
        state: >
          {% set peak1 = states('input_number.peak_1_verdi') | float(0) %}
          {% set peak2 = states('input_number.peak_2_verdi') | float(0) %}
          {% set peak3 = states('input_number.peak_3_verdi') | float(0) %}
          {% if peak1 > 0 and peak2 > 0 and peak3 > 0 %}
            {{ ((peak1 + peak2 + peak3) / 3) | round(2) }}
          {% elif peak1 > 0 and peak2 > 0 %}
            {{ ((peak1 + peak2) / 2) | round(2) }}
          {% elif peak1 > 0 %}
            {{ peak1 | round(2) }}
          {% else %}
            0
          {% endif %}
        attributes:
          peak_1: "{{ states('input_number.peak_1_verdi') | float(0) | round(2) }}"
          peak_2: "{{ states('input_number.peak_2_verdi') | float(0) | round(2) }}"
          peak_3: "{{ states('input_number.peak_3_verdi') | float(0) | round(2) }}"
          peak_1_tid: "{{ states('input_text.peak_1_tidspunkt') }}"
          peak_2_tid: "{{ states('input_text.peak_2_tidspunkt') }}"
          peak_3_tid: "{{ states('input_text.peak_3_tidspunkt') }}"

      # Trygg grense (hva kan jeg bruke uten å påvirke kapasitetsledd?)
      - name: "Kapasitetsledd trygg grense"
        unique_id: kapasitetsledd_trygg_grense
        unit_of_measurement: "kWh"
        icon: mdi:shield-check
        state: >
          {% set peak1 = states('input_number.peak_1_verdi') | float(0) %}
          {% set peak2 = states('input_number.peak_2_verdi') | float(0) %}
          {% set peak3 = states('input_number.peak_3_verdi') | float(0) %}
          {% set maal = states('input_number.kapasitetsledd_maal') | float(5.0) %}
          {% if peak3 == 0 %}
            {{ maal | round(1) }}
          {% else %}
            {{ (peak3 - 0.1) | round(1) }}
          {% endif %}

      # Potensielt kapasitetsledd hvis prognosen realiseres
      - name: "Kapasitetsledd hvis prognose"
        unique_id: kapasitetsledd_hvis_prognose
        unit_of_measurement: "kW"
        device_class: power
        icon: mdi:crystal-ball
        state: >
          {% set prognose = states('sensor.prognose_for_innevaerende_time') | float(0) %}
          {% set peak1 = states('input_number.peak_1_verdi') | float(0) %}
          {% set peak2 = states('input_number.peak_2_verdi') | float(0) %}
          {% set peak3 = states('input_number.peak_3_verdi') | float(0) %}
          {% if prognose > peak1 %}
            {{ ((prognose + peak1 + peak2) / 3) | round(2) }}
          {% elif prognose > peak2 %}
            {{ ((peak1 + prognose + peak2) / 3) | round(2) }}
          {% elif prognose > peak3 %}
            {{ ((peak1 + peak2 + prognose) / 3) | round(2) }}
          {% else %}
            {{ states('sensor.kapasitetsledd_aktuelt') | float(0) }}
          {% endif %}

      # Margin til målgrense
      - name: "Kapasitetsledd margin"
        unique_id: kapasitetsledd_margin
        unit_of_measurement: "kW"
        icon: mdi:gauge
        state: >
          {% set aktuelt = states('sensor.kapasitetsledd_aktuelt') | float(0) %}
          {% set maal = states('input_number.kapasitetsledd_maal') | float(5.0) %}
          {{ (maal - aktuelt) | round(2) }}
        attributes:
          prosent: >
            {% set aktuelt = states('sensor.kapasitetsledd_aktuelt') | float(0) %}
            {% set maal = states('input_number.kapasitetsledd_maal') | float(5.0) %}
            {% if maal > 0 %}
              {{ ((aktuelt / maal) * 100) | round(0) | int }}
            {% else %}
              0
            {% endif %}

      # Kutt-anbefaling (skal vi kutte nå?)
      - name: "Kapasitetsledd kutt anbefaling"
        unique_id: kapasitetsledd_kutt_anbefaling
        icon: mdi:alert-decagram
        state: >
          {% set prognose = states('sensor.prognose_for_innevaerende_time') | float(0) %}
          {% set hvis_prognose = states('sensor.kapasitetsledd_hvis_prognose') | float(0) %}
          {% set maal = states('input_number.kapasitetsledd_maal') | float(5.0) %}
          {% set trygg = states('sensor.kapasitetsledd_trygg_grense') | float(0) %}
          {% if prognose > trygg and hvis_prognose > maal %}
            KUTT NÅ!
          {% elif prognose > trygg %}
            VARSLING
          {% else %}
            TRYGT
          {% endif %}
        attributes:
          grunn: >
            {% set prognose = states('sensor.prognose_for_innevaerende_time') | float(0) %}
            {% set hvis_prognose = states('sensor.kapasitetsledd_hvis_prognose') | float(0) %}
            {% set maal = states('input_number.kapasitetsledd_maal') | float(5.0) %}
            {% set trygg = states('sensor.kapasitetsledd_trygg_grense') | float(0) %}
            {% if prognose > trygg and hvis_prognose > maal %}
              Prognose {{ prognose }} kWh vil gi kapasitetsledd {{ hvis_prognose }} kW (over mål {{ maal }} kW)
            {% elif prognose > trygg %}
              Prognose {{ prognose }} kWh er over trygg grense {{ trygg }} kWh, men kapasitetsledd {{ hvis_prognose }} kW er under mål
            {% else %}
              Prognose {{ prognose }} kWh er under trygg grense {{ trygg }} kWh
            {% endif %}

  # ===================================================================
  # BINARY SENSOR
  # ===================================================================
  - binary_sensor:
      - name: "Kapasitetsledd faresone"
        unique_id: kapasitetsledd_faresone
        device_class: problem
        state: >
          {% set margin = states('sensor.kapasitetsledd_margin') | float(0) %}
          {{ margin < 0.5 }}
