# ===================================================================
# KOMPLETT DASHBOARD - KAPASITETSLEDD + EFFEKTSTYRING
# ===================================================================
# Design: Moderne, responsivt, fungerer på PC og mobil
# Kombinerer NYE kapasitetsledd-sensorer med eksisterende forbruksoversikt
# ===================================================================

type: vertical-stack
cards:
  # ===================================================================
  # HEADER: KAPASITETSLEDD-OVERSIKT
  # ===================================================================
  - type: markdown
    content: |
      # ⚡ Smart Kapasitetsledd-system
      **Automatisk styring basert på ekte norsk kapasitetsledd-formel**

      <div style="text-align: center; margin: 10px 0; padding: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; color: white; font-size: 14px;">
        {% set anbefaling = states('sensor.kapasitetsledd_kutt_anbefaling') %}
        {% if anbefaling == 'KUTT NÅ!' %}
          🚨 <b>KUTT NÅ!</b> - Laster kuttes for å holde kapasitetsledd under mål
        {% elif anbefaling == 'VARSLING' %}
          ⚠️ <b>VARSLING</b> - Prognose nærmer seg trygg grense
        {% else %}
          ✅ <b>TRYGT</b> - Forbruket er innenfor trygg grense
        {% endif %}
      </div>
    card_mod:
      style: |
        ha-card {
          background: var(--ha-card-background);
          border-radius: 16px;
          box-shadow: var(--ha-card-box-shadow);
          margin-bottom: 8px;
        }

  # ===================================================================
  # HOVEDGAUGES: KAPASITETSLEDD vs MÅL
  # ===================================================================
  - type: horizontal-stack
    cards:
      # Kapasitetsledd aktuelt
      - type: gauge
        entity: sensor.kapasitetsledd_aktuelt
        name: Kapasitetsledd Aktuelt
        unit: kW
        min: 0
        max: 10
        needle: true
        severity:
          green: 0
          yellow: 4.5
          red: 5.0
        segments:
          - from: 0
            color: "#4CAF50"
          - from: 4.5
            color: "#FF9800"
          - from: 5.0
            color: "#F44336"
        card_mod:
          style: |
            ha-card {
              border-radius: 16px;
            }

      # Prognose
      - type: gauge
        entity: sensor.prognose_for_innevaerende_time
        name: Prognose (denne timen)
        unit: kWh
        min: 0
        max: 10
        needle: true
        severity:
          green: 0
          yellow: 4.0
          red: 5.0
        segments:
          - from: 0
            color: "#4CAF50"
          - from: 4.0
            color: "#FF9800"
          - from: 5.0
            color: "#F44336"
        card_mod:
          style: |
            ha-card {
              border-radius: 16px;
            }

  # ===================================================================
  # KAPASITETSLEDD-STATUS: Margin, Trygg grense, Hvis prognose
  # ===================================================================
  - type: entities
    title: 📊 Kapasitetsledd-status
    show_header_toggle: false
    entities:
      - entity: sensor.kapasitetsledd_aktuelt
        name: Kapasitetsledd nå
        icon: mdi:transmission-tower
        type: custom:multiple-entity-row
        secondary_info:
          attribute: peak_1
          name: "Peak #1"
          unit: kWh
        entities:
          - attribute: peak_2
            name: "P2"
            unit: kWh
          - attribute: peak_3
            name: "P3"
            unit: kWh

      - entity: input_number.kapasitetsledd_maal
        name: Målgrense
        icon: mdi:target

      - entity: sensor.kapasitetsledd_margin
        name: Margin til mål
        icon: mdi:gauge
        type: custom:multiple-entity-row
        secondary_info:
          attribute: prosent
          name: Utnyttelse
          unit: "%"

      - entity: sensor.kapasitetsledd_trygg_grense
        name: Trygg grense (denne timen)
        icon: mdi:shield-check

      - entity: sensor.kapasitetsledd_hvis_prognose
        name: Kapasitetsledd hvis prognose
        icon: mdi:crystal-ball

      - entity: sensor.kapasitetsledd_kutt_anbefaling
        name: Anbefaling
        icon: mdi:alert-decagram
    card_mod:
      style: |
        ha-card {
          border-radius: 16px;
        }

  # ===================================================================
  # TOPP-3 VISUALISERING (NY DESIGN)
  # ===================================================================
  - type: markdown
    content: |
      <div style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); padding: 20px; border-radius: 16px; margin: 8px 0;">
        <h3 style="margin: 0 0 15px 0; text-align: center; color: #1a1a1a;">🏆 Topp-3 denne måneden</h3>

        <table style="width: 100%; border-collapse: separate; border-spacing: 0 8px;">
          <tr style="background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            <td style="padding: 16px; border-radius: 12px 0 0 12px; text-align: center; font-size: 28px; width: 60px;">🥇</td>
            <td style="padding: 16px; font-weight: bold; font-size: 20px; width: 100px;">{{ states('input_number.peak_1_verdi') | round(2) }} kWh</td>
            <td style="padding: 16px; border-radius: 0 12px 12px 0; color: #333; font-size: 14px;">{{ states('input_text.peak_1_tidspunkt') }}</td>
          </tr>
          <tr style="background: linear-gradient(135deg, #C0C0C0 0%, #A8A8A8 100%); color: #1a1a1a; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
            <td style="padding: 14px; border-radius: 12px 0 0 12px; text-align: center; font-size: 24px; width: 60px;">🥈</td>
            <td style="padding: 14px; font-weight: bold; font-size: 18px; width: 100px;">{{ states('input_number.peak_2_verdi') | round(2) }} kWh</td>
            <td style="padding: 14px; border-radius: 0 12px 12px 0; color: #333; font-size: 13px;">{{ states('input_text.peak_2_tidspunkt') }}</td>
          </tr>
          <tr style="background: linear-gradient(135deg, #CD7F32 0%, #B8732A 100%); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
            <td style="padding: 14px; border-radius: 12px 0 0 12px; text-align: center; font-size: 22px; width: 60px;">🥉</td>
            <td style="padding: 14px; font-weight: bold; font-size: 16px; width: 100px;">{{ states('input_number.peak_3_verdi') | round(2) }} kWh</td>
            <td style="padding: 14px; border-radius: 0 12px 12px 0; color: #f0f0f0; font-size: 13px;">{{ states('input_text.peak_3_tidspunkt') }}</td>
          </tr>
        </table>

        <div style="margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.5); border-radius: 8px; text-align: center;">
          <div style="font-size: 18px; font-weight: bold; color: #1a1a1a; margin-bottom: 4px;">
            Kapasitetsledd: {{ states('sensor.kapasitetsledd_aktuelt') }} kW
          </div>
          <div style="font-size: 13px; color: #666;">
            ({{ states('input_number.peak_1_verdi') | float | round(2) }} + {{ states('input_number.peak_2_verdi') | float | round(2) }} + {{ states('input_number.peak_3_verdi') | float | round(2) }}) ÷ 3
          </div>
        </div>

        <div style="text-align: center; color: #666; font-size: 11px; margin-top: 12px; opacity: 0.8;">
          📅 {{ now().strftime('%B %Y') }} • Oppdatert {{ now().strftime('%d.%m kl. %H:%M') }}
        </div>
      </div>
    card_mod:
      style: |
        ha-card {
          background: transparent;
          box-shadow: none;
        }

  # ===================================================================
  # POWER FLOW (EKSISTERENDE - BEHOLDT)
  # ===================================================================
  - type: custom:power-flow-card-plus
    entities:
      grid:
        entity: sensor.p1_meter_power
        name: Strømnett
        icon: mdi:transmission-tower
        color_icon: true
        display_zero: true
        unit_of_display: W
      home:
        entity: sensor.leilighet_restforbruk
        name: Leilighet
        color_icon: grid
        override_state: true
        icon: mdi:home
        display_zero: true
      individual:
        - entity: sensor.shellyplus1pm_a8032ab13280_power
          name: Billader
          icon: mdi:car-electric
          color: "#4a90e2"
          display_zero: false
          display_zero_tolerance: 5
          unit_of_display: W
        - entity: sensor.shellyplus1pm_a8032ab117c0_power
          name: Ventilasjon
          icon: mdi:fan
          color: "#50e3c2"
          display_zero: false
          display_zero_tolerance: 2
          unit_of_display: W
        - entity: sensor.heavy_duty_switch_electric_consumption_w
          name: Varmtvannsbereder
          icon: mdi:water-boiler
          color: "#f5a623"
          display_zero: false
          display_zero_tolerance: 5
          unit_of_display: W
        - entity: sensor.floor_thermostat_electric_consumption_w
          name: Badegulv
          icon: mdi:radiator
          color: "#d0021b"
          display_zero: false
          display_zero_tolerance: 1
          unit_of_display: W
        - entity: sensor.wiz_socket_d875d8_power
          name: Teknisk
          icon: mdi:server
          color: "#9b59b6"
          display_zero: false
          display_zero_tolerance: 2
          unit_of_display: W
        - entity: sensor.wiz_socket_da42ef_power
          name: Kaffetrakter
          icon: mdi:coffee-maker
          color: "#795548"
          display_zero: false
          display_zero_tolerance: 2
          unit_of_display: W
      fossil_fuel_percentage:
        entity: sensor.electricity_maps_grid_fossil_fuel_percentage
        name: Grønn
        state_type: percentage
        icon: mdi:leaf
        color_icon: true
        display_zero: true
        invert_value: true
        unit_of_display: "%"
    w_decimals: 0
    kw_decimals: 2
    watt_threshold: 1000
    min_flow_rate: 0.5
    max_flow_rate: 6
    clickable_entities: true
    use_new_flow_rate_model: true
    transparency_zero_lines: 0.3
    energy_date_selection: true
    title: ⚡ Live Strømforbruk
    animation: fade
    animation_speed: 2
    show_units: true
    show_states: true
    show_icons: true
    colors:
      grid_consumption: "#ef4444"
      grid_production: "#22c55e"
      home_consumption: "#3b82f6"
      individual_consumption: "#8b5cf6"

  # ===================================================================
  # ENHETSKONTROLL (MODERNE BUTTON CARDS)
  # ===================================================================
  - type: markdown
    content: |
      ## 🎛️ Høyeffektsenheter
      **Automatisk kuttes av kapasitetsledd-systemet ved behov**
    card_mod:
      style: |
        ha-card {
          background: transparent;
          box-shadow: none;
          padding: 8px 16px 0 16px;
        }

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: switch.heavy_duty_switch
        name: Varmtvannsbereder
        icon: mdi:water-boiler
        show_state: true
        show_last_changed: true
        state_display: |
          [[[
            const power = parseFloat(states['sensor.heavy_duty_switch_electric_consumption_w'].state);
            if (power > 5) return `Varmer (${Math.round(power)}W)`;
            if (entity.state == 'on') return 'Klar';
            return 'Avslått';
          ]]]
        show_label: true
        label: |
          [[[
            const peakDisabled = states['input_boolean.peak_kontroll_vvb_deaktivert'].state == 'on';
            if (peakDisabled) return '⚠️ Kuttet av kapasitetsledd';
            return '✅ Automatisk styring';
          ]]]
        styles:
          card:
            - height: 100px
            - border-radius: 16px
            - box-shadow: 0 2px 8px rgba(0,0,0,0.1)
          name:
            - font-size: 14px
            - font-weight: bold
          state:
            - font-size: 12px
          label:
            - font-size: 10px
            - margin-top: 4px
          icon:
            - width: 35px
            - height: 35px
            - color: |
                [[[
                  const peakDisabled = states['input_boolean.peak_kontroll_vvb_deaktivert'].state == 'on';
                  const power = parseFloat(states['sensor.heavy_duty_switch_electric_consumption_w'].state);

                  if (peakDisabled) return '#FF5722';
                  if (power > 5) return '#4CAF50';
                  if (entity.state == 'on') return '#2196F3';
                  return 'var(--disabled-color)';
                ]]]
        tap_action:
          action: toggle
        hold_action:
          action: more-info

      - type: custom:button-card
        entity: switch.shellyplus1pm_a8032ab13280
        name: Elbil-lader
        icon: mdi:car-electric
        show_state: true
        show_last_changed: true
        state_display: |
          [[[
            const power = parseFloat(states['sensor.shellyplus1pm_a8032ab13280_power'].state);
            if (power > 5) return `Lader (${Math.round(power)}W)`;
            if (entity.state == 'on') return 'Klar';
            return 'Avslått';
          ]]]
        show_label: true
        label: |
          [[[
            const temp = states['sensor.shellyplus1pm_a8032ab13280_temperature'].state;
            const overheating = states['input_boolean.overoppheting_billader_deaktivert'].state == 'on';
            const disabled = states['input_boolean.peak_kontroll_billader_deaktivert'].state == 'on';

            if (overheating) return `🔥 Overoppheting (${temp}°C)`;
            if (disabled) return '⚠️ Kuttet av kapasitetsledd';
            if (temp) return `✅ ${temp}°C - Automatisk`;
            return '✅ Automatisk styring';
          ]]]
        styles:
          card:
            - height: 100px
            - border-radius: 16px
            - box-shadow: 0 2px 8px rgba(0,0,0,0.1)
          name:
            - font-size: 14px
            - font-weight: bold
          state:
            - font-size: 12px
          label:
            - font-size: 10px
            - margin-top: 4px
          icon:
            - width: 35px
            - height: 35px
            - color: |
                [[[
                  if (states['input_boolean.overoppheting_billader_deaktivert'].state == 'on') return '#FF9800';
                  if (states['input_boolean.peak_kontroll_billader_deaktivert'].state == 'on') return '#FF5722';
                  const power = parseFloat(states['sensor.shellyplus1pm_a8032ab13280_power'].state);
                  if (power > 5) return '#4CAF50';
                  if (entity.state == 'on') return '#2196F3';
                  return 'var(--disabled-color)';
                ]]]
        tap_action:
          action: toggle
        hold_action:
          action: more-info

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: climate.floor_thermostat
        name: Gulvvarme Bad
        icon: mdi:radiator
        show_state: true
        show_last_changed: true
        state_display: |
          [[[
            const heating = states['switch.floor_thermostat'].state == 'on';
            const target = entity.attributes.temperature;
            const current = entity.attributes.current_temperature;

            if (heating) return `Varmer (${current}°→${target}°C)`;
            if (entity.state == 'heat') return `Klar (${current}°C)`;
            return `Av (${current}°C)`;
          ]]]
        show_label: true
        label: |
          [[[
            const disabled = states['input_boolean.peak_kontroll_badegulv_deaktivert'].state == 'on';
            if (disabled) return '⚠️ Kuttet av kapasitetsledd';
            return '✅ Automatisk styring';
          ]]]
        styles:
          card:
            - height: 100px
            - border-radius: 16px
            - box-shadow: 0 2px 8px rgba(0,0,0,0.1)
          name:
            - font-size: 14px
            - font-weight: bold
          state:
            - font-size: 12px
          label:
            - font-size: 10px
            - margin-top: 4px
          icon:
            - width: 35px
            - height: 35px
            - color: |
                [[[
                  if (states['input_boolean.peak_kontroll_badegulv_deaktivert'].state == 'on') return '#FF5722';
                  if (states['switch.floor_thermostat'].state == 'on') return '#4CAF50';
                  if (entity.state == 'heat') return '#2196F3';
                  return 'var(--disabled-color)';
                ]]]
        tap_action:
          action: more-info

      - type: custom:button-card
        entity: climate.daikinap54875_room_temperature
        name: VP Stue
        icon: mdi:heat-pump
        show_state: true
        show_last_changed: true
        state_display: |
          [[[
            const current = entity.attributes.current_temperature;
            const target = entity.attributes.temperature;

            if (entity.state == 'off') return `Av (${current}°C)`;
            return `${entity.state} (${current}°→${target}°C)`;
          ]]]
        show_label: true
        label: |
          [[[
            const disabled = states['input_boolean.peak_kontroll_vp_stue_deaktivert'].state == 'on';
            if (disabled) return '⚠️ Kuttet av kapasitetsledd';
            return '✅ Automatisk styring';
          ]]]
        styles:
          card:
            - height: 100px
            - border-radius: 16px
            - box-shadow: 0 2px 8px rgba(0,0,0,0.1)
          name:
            - font-size: 14px
            - font-weight: bold
          state:
            - font-size: 12px
          label:
            - font-size: 10px
            - margin-top: 4px
          icon:
            - width: 35px
            - height: 35px
            - color: |
                [[[
                  if (states['input_boolean.peak_kontroll_vp_stue_deaktivert'].state == 'on') return '#FF5722';
                  if (entity.state != 'off') return '#4CAF50';
                  return 'var(--disabled-color)';
                ]]]
        tap_action:
          action: more-info

      - type: custom:button-card
        entity: climate.vp_datarom
        name: VP Kontor
        icon: mdi:heat-pump
        show_state: true
        show_last_changed: true
        state_display: |
          [[[
            const current = entity.attributes.current_temperature;
            const target = entity.attributes.temperature;

            if (entity.state == 'off') return `Av (${current}°C)`;
            return `${entity.state} (${current}°→${target}°C)`;
          ]]]
        show_label: true
        label: |
          [[[
            const disabled = states['input_boolean.peak_kontroll_vp_kontor_deaktivert'].state == 'on';
            if (disabled) return '⚠️ Kuttet av kapasitetsledd';
            return '✅ Automatisk styring';
          ]]]
        styles:
          card:
            - height: 100px
            - border-radius: 16px
            - box-shadow: 0 2px 8px rgba(0,0,0,0.1)
          name:
            - font-size: 14px
            - font-weight: bold
          state:
            - font-size: 12px
          label:
            - font-size: 10px
            - margin-top: 4px
          icon:
            - width: 35px
            - height: 35px
            - color: |
                [[[
                  if (states['input_boolean.peak_kontroll_vp_kontor_deaktivert'].state == 'on') return '#FF5722';
                  if (entity.state != 'off') return '#4CAF50';
                  return 'var(--disabled-color)';
                ]]]
        tap_action:
          action: more-info

  # ===================================================================
  # PERSON TRACKING OG LYS
  # ===================================================================
  - type: markdown
    content: |
      ## 👤 Hjemme / Lys
    card_mod:
      style: |
        ha-card {
          background: transparent;
          box-shadow: none;
          padding: 8px 16px 0 16px;
        }

  - type: horizontal-stack
    cards:
      # Person tracking - Erik
      - type: custom:button-card
        entity: device_tracker.iphone_17pro
        name: Erik
        show_entity_picture: true
        entity_picture: /local/avatars/erik.png
        show_state: false
        tap_action:
          action: more-info
        custom_fields:
          status: |
            [[[
              const s = entity.state;
              const home = s === 'home' ? 'Hjemme' : (s === 'not_home' ? 'Borte' : (s || 'Ukjent'));
              const batt = parseFloat(states['sensor.iphone_17pro_battery_level']?.state);
              const battTxt = isNaN(batt) ? '' : ` • ${Math.round(batt)}%`;
              return home + battTxt;
            ]]]
          meta: |
            [[[
              const conn = states['sensor.iphone_17pro_connection_type']?.state ?? '';
              const ssid = states['sensor.iphone_17pro_ssid']?.state ?? '';
              if ((conn||'').toLowerCase() === 'wifi' && ssid) return `Wi-Fi: ${ssid}`;
              if (conn && conn.toLowerCase() !== 'unavailable') return `${conn}`;
              return '';
            ]]]
        styles:
          card:
            - padding: 14px
            - border-radius: 16px
            - box-shadow: 0 2px 8px rgba(0,0,0,0.1)
            - border: 2px solid var(--divider-color)
          grid:
            - grid-template-areas: '"i n" "i status" "i meta"'
            - grid-template-columns: 60px 1fr
            - grid-template-rows: auto auto auto
            - column-gap: 12px
            - row-gap: 4px
          img_cell:
            - width: 60px
            - height: 60px
            - border-radius: 50%
            - background: |
                [[[
                  const v = parseFloat(states['sensor.iphone_17pro_battery_level']?.state);
                  const pct = isNaN(v) ? 0 : Math.round(v);
                  const on = entity.state === 'home';
                  const col = on ? '#4CAF50' : '#FF9800';
                  return `conic-gradient(${col} 0 ${pct}%, var(--divider-color) ${pct}% 100%)`;
                ]]]
          picture:
            - border-radius: 50%
            - width: 54px
            - height: 54px
            - margin: 3px
          name:
            - font-weight: 700
            - font-size: 1.05rem
          custom_fields:
            status:
              - font-size: 0.9rem
              - padding: 2px 8px
              - border-radius: 999px
              - background: |
                  [[[
                    return entity.state === 'home' ? 'rgba(76,175,80,0.18)' : 'rgba(255,193,7,0.20)';
                  ]]]
              - color: |
                  [[[
                    return entity.state === 'home' ? '#4CAF50' : '#FF9800';
                  ]]]
            meta:
              - font-size: 0.85rem
              - opacity: 0.9
        state:
          - value: home
            styles:
              card:
                - border: 2px solid var(--google-green-500)
          - value: not_home
            styles:
              card:
                - border: 2px solid var(--google-yellow-500)

  # Gang lys + Hovedsoverom lys
  - type: horizontal-stack
    cards:
      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.lys_gang
        name: Gang lys
        icon: mdi:lightbulb
        slider_live_update: true
        show_last_changed: true
        tap_action:
          action: toggle
        styles: |
          .bubble-button-card-container {
            border-radius: 16px;
          }

      - type: custom:bubble-card
        card_type: button
        button_type: slider
        entity: light.lys_hovedsoverom
        name: Soverom
        icon: mdi:bed
        slider_live_update: true
        show_last_changed: true
        tap_action:
          action: toggle
        styles: |
          .bubble-button-card-container {
            border-radius: 16px;
          }

  # ===================================================================
  # DETALJERT FORBRUK
  # ===================================================================
  - type: entities
    title: 📊 Detaljert forbruk og nettinfo
    show_header_toggle: false
    entities:
      - type: section
        label: Forbruk
      - entity: sensor.p1_meter_power
        name: Totalt forbruk
        icon: mdi:flash
      - entity: sensor.hourly_energy
        name: Forbruk denne timen
        icon: mdi:counter
